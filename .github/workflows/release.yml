name: Release

on:
    push:
        branches:
            - main

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.9"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install bump2version
                  pip install tomli tomli-w

            - name: Configure Git
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"

            - name: Get current version
              id: current_version
              run: |
                  VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "Current version: $VERSION"

            - name: Bump version (patch)
              id: bump_version
              run: |
                  bump2version patch --verbose
                  NEW_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
                  echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
                  echo "New version: $NEW_VERSION"

            - name: Create version tag
              id: tag_version
              run: |
                  NEW_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
                  TAG="v${NEW_VERSION}"
                  git tag -a "$TAG" -m "Release $TAG"
                  echo "tag=$TAG" >> $GITHUB_OUTPUT
                  echo "Created tag: $TAG"

            - name: Build zipapp
              run: |
                  python3 scripts/build.py

            - name: Create release archive
              run: |
                  NEW_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
                  mkdir -p release
                  cp dist/wbat_statusbar.py release/
                  cp -r shell release/
                  cp -r docs release/
                  cp README.md release/
                  cp LICENSE release/ 2>/dev/null || true
                  tar -czf wbat-iterm-status-v${NEW_VERSION}.tar.gz -C release .
                  zip -r wbat-iterm-status-v${NEW_VERSION}.zip release/

            - name: Push version bump and tag
              run: |
                  git push origin main
                  git push origin --tags

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.tag_version.outputs.tag }}
                  name: Release ${{ steps.tag_version.outputs.tag }}
                  body: |
                      ## Changes

                      See [CHANGELOG.md](CHANGELOG.md) for details.

                      ## Downloads

                      - `wbat-iterm-status-v${{ steps.bump_version.outputs.new_version }}.tar.gz`
                      - `wbat-iterm-status-v${{ steps.bump_version.outputs.new_version }}.zip`
                  files: |
                      wbat-iterm-status-v${{ steps.bump_version.outputs.new_version }}.tar.gz
                      wbat-iterm-status-v${{ steps.bump_version.outputs.new_version }}.zip
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
