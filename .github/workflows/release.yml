name: Release

on:
        push:
                tags:
                        - "v*"
                branches:
                        - main
                        - init

jobs:
        release:
                runs-on: ubuntu-latest

                steps:
                        - uses: actions/checkout@v4

                        - name: Set up Python
                          uses: actions/setup-python@v5
                          with:
                                  python-version: "3.9"

                        - name: Install dependencies
                          run: |
                                  python -m pip install --upgrade pip
                                  pip install -r requirements.txt

                        - name: Build zipapp
                          run: |
                                  python3 scripts/build.py

                        - name: Create release archive
                          run: |
                                  mkdir -p release
                                  cp dist/wbat_statusbar.py release/
                                  cp -r shell release/
                                  cp -r docs release/
                                  cp README.md release/
                                  cp LICENSE release/ 2>/dev/null || true
                                  tar -czf wbat-iterm-status-${{ github.ref_name }}.tar.gz -C release .
                                  zip -r wbat-iterm-status-${{ github.ref_name }}.zip release/

                        - name: Create GitHub Release
                          if: startsWith(github.ref, 'refs/tags/v')
                          uses: softprops/action-gh-release@v1
                          with:
                                  files: |
                                          wbat-iterm-status-${{ github.ref_name }}.tar.gz
                                          wbat-iterm-status-${{ github.ref_name }}.zip
                                  draft: false
                                  prerelease: false
                          env:
                                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

                        - name: Upload build artifacts
                          if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
                          uses: actions/upload-artifact@v4
                          with:
                                  name: wbat-iterm-status-build
                                  path: |
                                          wbat-iterm-status-*.tar.gz
                                          wbat-iterm-status-*.zip
                                  retention-days: 30
