name: CI

on:
        push:
                branches: [main, init]
        pull_request:
                branches: [main, init]

jobs:
        lint:
                runs-on: ubuntu-latest
                steps:
                        - uses: actions/checkout@v4

                        - name: Set up Python
                          uses: actions/setup-python@v5
                          with:
                                  python-version: "3.9"

                        - name: Install dependencies
                          run: |
                                  python -m pip install --upgrade pip
                                  pip install ruff black

                        - name: Lint with ruff
                          run: |
                                  ruff check src/ tests/

                        - name: Check formatting with black
                          run: |
                                  black --check src/ tests/

        test:
                runs-on: ${{ matrix.os }}
                strategy:
                        matrix:
                                os: [ubuntu-latest, macos-latest]
                                python-version: ["3.9", "3.10", "3.11"]

                steps:
                        - uses: actions/checkout@v4

                        - name: Set up Python ${{ matrix.python-version }}
                          uses: actions/setup-python@v5
                          with:
                                  python-version: ${{ matrix.python-version }}

                        - name: Install dependencies
                          run: |
                                  python -m pip install --upgrade pip
                                  # Install base dependencies (skip iterm2 on Linux)
                                  pip install "tomli>=2.0.1; python_version < '3.11'" tomli-w
                                  pip install pytest pytest-asyncio
                                  # iterm2 is macOS-only, install only on macOS
                                  if [ "${{ matrix.os }}" == "macos-latest" ]; then
                                    pip install "iterm2>=2.7" || echo "iterm2 install failed, continuing"
                                  else
                                    echo "Skipping iterm2 on Linux (macOS-only dependency)"
                                  fi

                        - name: Run tests
                          run: |
                                  pytest tests/ -v

        build:
                runs-on: ubuntu-latest
                needs: [lint, test]

                steps:
                        - uses: actions/checkout@v4

                        - name: Set up Python
                          uses: actions/setup-python@v5
                          with:
                                  python-version: "3.9"

                        - name: Build zipapp
                          run: |
                                  python3 scripts/build.py

                        - name: Verify zipapp
                          run: |
                                  python3 -m zipfile -l dist/wbat_statusbar.py
                                  ls -lh dist/wbat_statusbar.py
